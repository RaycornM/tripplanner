# TripPlanner Nginx 配置（绿联 DXP4800 / nginx:1.27-alpine 验证通过）
# 注意：本文件挂载到 /etc/nginx/conf.d/tripplanner.conf
#       entrypoint 已提前删除 default.conf，避免两个 server {} 同端口竞争导致 403

server {
    # 只监听 IPv4（容器里没有 IPv6 时 [::]:80 会触发 warn）
    listen 80 default_server;
    server_name _;

    # 文档根（和 volume 挂载点一致）
    root  /usr/share/nginx/html;
    index index.html;

    # 默认字符集（避免中文乱码）
    charset utf-8;

    # 禁止列目录（空目录时不会列出内容）
    autoindex off;

    # -------- 安全响应头 --------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options      "SAMEORIGIN" always;
    add_header Referrer-Policy      "strict-origin-when-cross-origin" always;

    # -------- 主路由 --------
    # 注意：不用 SPA 的 try_files + error_page 404 组合（那会和静态目录访问 404 触发循环）
    # 这里是纯静态站点，直接按文件返回就行
    location / {
        try_files $uri $uri/ =404;
    }

    # -------- 缓存策略 --------
    # HTML：每次都重新校验（不缓存，确保新版本即时生效）
    location ~* \.html$ {
        expires off;
        add_header Cache-Control "no-cache, private, must-revalidate, max-age=0";
    }

    # CSS / JS：缓存 7 天（开发期强制刷新即可，部署后稳定）
    location ~* \.(css|js|mjs)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 图片 / 字体：缓存 30 天
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # -------- gzip 压缩（减少 70% 传输量） --------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # -------- 错误页（纯静态，直接用内置简短内容） --------
    error_page 404 /404.html;
    location = /404.html {
        internal;
        default_type text/html;
        return 404 '<!doctype html><html><head><meta charset=utf-8><title>404</title></head><body style=font-family:sans-serif;text-align:center;padding:60px><h1>404</h1><p>页面不存在</p><a href=/ style=color:#3b82f6>返回首页</a></body></html>';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; return 500 'Server error'; }
}
