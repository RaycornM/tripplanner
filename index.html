<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#4A90D9" />
  <title>旅途伴旅 · TripPlanner</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Leaflet 地图 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Chart.js 饼图 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- SortableJS 拖拽排序 -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
  <!-- 桌面端侧边栏（>=1024px 显示，移动端隐藏） -->
  <aside class="desktop-sidebar" id="desktopSidebar">
    <div class="ds-brand">
      <div class="ds-brand-icon">
        <span class="ic-svg" id="ds-brand-ic"></span>
      </div>
      <div class="ds-brand-text">
        <h1>旅途伴旅</h1>
        <p>TripPlanner</p>
      </div>
    </div>

    <nav class="ds-nav">
      <div class="ds-nav-section">
        <span class="ds-nav-label">主菜单</span>
        <button class="ds-nav-item active" data-route="home" onclick="App.navigate('home')">
          <span class="ds-nav-icon" id="ds-nav-trips"></span>
          <span class="ds-nav-text">行程</span>
        </button>
        <button class="ds-nav-item" data-route="checklist" onclick="App.navigate('checklist')">
          <span class="ds-nav-icon" id="ds-nav-checklist"></span>
          <span class="ds-nav-text">打包清单</span>
        </button>
        <button class="ds-nav-item" data-route="cost" onclick="App.navigate('cost')">
          <span class="ds-nav-icon" id="ds-nav-cost"></span>
          <span class="ds-nav-text">花费记账</span>
        </button>
        <button class="ds-nav-item" data-route="explore" onclick="App.navigate('explore')">
          <span class="ds-nav-icon" id="ds-nav-explore"></span>
          <span class="ds-nav-text">探索目的地</span>
        </button>
        <button class="ds-nav-item" data-route="templates" onclick="App.navigate('templates')">
          <span class="ds-nav-icon" id="ds-nav-tpl"></span>
          <span class="ds-nav-text">行程模板</span>
        </button>
      </div>
      <div class="ds-nav-section">
        <span class="ds-nav-label">协同与工具</span>
        <button class="ds-nav-item" data-route="co-planning" onclick="App.navigate('co-planning')">
          <span class="ds-nav-icon" id="ds-nav-collab"></span>
          <span class="ds-nav-text">协同大厅</span>
        </button>
        <button class="ds-nav-item" data-route="notifications" onclick="App.navigate('notifications')">
          <span class="ds-nav-icon" id="ds-nav-notif"></span>
          <span class="ds-nav-text">通知中心</span>
          <span class="ds-nav-badge">3</span>
        </button>
        <button class="ds-nav-item" data-route="design-system" onclick="App.navigate('design-system')">
          <span class="ds-nav-icon" id="ds-nav-ds"></span>
          <span class="ds-nav-text">设计系统</span>
        </button>
      </div>
    </nav>

    <div class="ds-footer">
      <button class="ds-nav-item" data-route="me" onclick="App.navigate('me')" style="width:100%;">
        <span class="ds-nav-icon" id="ds-nav-me"></span>
        <span class="ds-nav-text">我的</span>
      </button>
    </div>
  </aside>

  <!-- 主内容区（桌面端 + 移动端共用） -->
  <div class="app-shell">
    <!-- Navigation Bar 顶部导航（标题/按钮由 app.js 动态控制） -->
    <header class="nav-bar" id="navBar">
      <button class="nav-btn mobile-only" id="mobileMenuBtn" style="display:none;">
        <span class="ic-svg" id="mobile-menu-ic"></span>
      </button>
      <div class="nav-left" id="navLeft"></div>
      <div class="nav-title" id="navTitle">旅途伴旅</div>
      <div class="nav-right" id="navRight"></div>
    </header>

    <!-- 页面内容区（app.js 渲染处） -->
    <main id="app" class="app-main page-pad"></main>

    <!-- 悬浮新建按钮（首页显示，由 app.js 控制） -->
    <button class="fab" id="fab" style="display:none;">＋</button>

    <!-- TabBar 底部导航（移动端显示，桌面端隐藏） -->
    <nav class="tab-bar mobile-only" id="tabBar">
      <button class="tab-item active" data-tab="trips" onclick="App.navigate('home')">
        <span class="tab-icon" id="tab-trips-ic"></span>
        <span>行程</span>
      </button>
      <button class="tab-item" data-tab="checklist" onclick="App.navigate('checklist')">
        <span class="tab-icon" id="tab-checklist-ic"></span>
        <span>清单</span>
      </button>
      <button class="tab-item" data-tab="cost" onclick="App.navigate('cost')">
        <span class="tab-icon" id="tab-cost-ic"></span>
        <span>记账</span>
      </button>
      <button class="tab-item" data-tab="me" onclick="App.navigate('me')">
        <span class="tab-icon" id="tab-me-ic"></span>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <!-- 模态框容器 -->
  <div id="modalRoot"></div>
  <!-- Toast 容器 -->
  <div id="toastRoot" class="toast-root"></div>

  <!-- 移动端遮罩层（侧边栏弹出时） -->
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <!-- 数据层 -->
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/templates.js"></script>
  <!-- 应用逻辑 -->
  <script src="js/app.js"></script>
</body>
</html>
